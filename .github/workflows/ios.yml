name: iOS build

# An unsigned release build of the iPhone app. Signing and installing happen
# on Linux with xtool: download the artifact, then `xtool install Juno.ipa`.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.3
          channel: stable
          cache: true
      - name: Sync settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          jq -n '{SUPABASE_URL: env.SUPABASE_URL, SUPABASE_ANON_KEY: env.SUPABASE_ANON_KEY}' > supabase.json
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define-from-file=supabase.json
      - name: Package
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Juno.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Juno-ipa
          path: Juno.ipa
          retention-days: 7
