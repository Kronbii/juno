name: iOS build

# An unsigned release build of the iPhone app, on every push that changes the
# app. Signing and installing happen on Linux with xtool: the
# juno-ios-refresh user service picks up the newest build when the phone is
# plugged in.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.3
          channel: stable
          cache: true
      - name: Sync settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          jq -n '{SUPABASE_URL: env.SUPABASE_URL, SUPABASE_ANON_KEY: env.SUPABASE_ANON_KEY}' > supabase.json
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define-from-file=supabase.json
      - name: Package
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Juno.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Juno-ipa
          path: Juno.ipa
          retention-days: 7
